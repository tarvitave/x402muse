name: Weekly Payout

on:
  schedule:
    # Every Monday at 00:05 UTC (5 min after week reset)
    - cron: '5 0 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  payout:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Payout
        run: |
          curl -sf -X POST \
            "https://x402muse.com/api/payout" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
        continue-on-error: true
