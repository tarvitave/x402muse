name: Deploy to Droplet

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout the code in the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Copy files to the Droplet (bypasses git clone auth issues on the server)
    - name: Copy to Droplet
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DO_HOST }}
        username: root
        key: ${{ secrets.DO_SSH_KEY }}
        source: "."
        target: "~/x402muse"
        rm: true # Cleans the target directory before copy to remove stale files

    # 3. Build and Run on the Droplet
    - name: Build and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DO_HOST }}
        username: root
        key: ${{ secrets.DO_SSH_KEY }}
        script: |
          cd ~/x402muse
          
          # Build Docker Image
          docker build -t muse-app .

          # Cleanup Old Container
          docker stop muse-app || true
          docker rm muse-app || true

          # Run New Container
          docker run -d \
            -p 80:3000 \
            --name muse-app \
            --restart always \
            muse-app
