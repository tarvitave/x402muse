name: Deploy to Droplet

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout the code in the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Copy files to the Droplet (bypasses git clone auth issues on the server)
    - name: Copy to Droplet
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DO_HOST }}
        username: root
        key: ${{ secrets.DO_SSH_KEY }}
        source: "."
        target: "~/x402muse"
        rm: true # Cleans the target directory before copy to remove stale files

    # 3. Build and Run on the Droplet
    - name: Build and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DO_HOST }}
        username: root
        key: ${{ secrets.DO_SSH_KEY }}
        timeout: 30m
        command_timeout: 30m
        script: |
          # 1. Setup Swap to prevent OOM kills during build (if not exists)
          if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
              echo "Created 2GB swap file"
          fi

          cd ~/x402muse

          # 2. Build Docker Image (with progress plain to see logs)
          docker build --progress=plain -t muse-app .

          # Cleanup Old App Container
          docker stop muse-app || true
          docker rm muse-app || true

          # Create persistent data directory on host
          mkdir -p ~/muse_data

          # Create Docker network for Caddy <-> App communication
          docker network create muse-net 2>/dev/null || true

          # Run App Container (only exposed to Docker network, not host)
          docker run -d \
            --name muse-app \
            --restart always \
            --network muse-net \
            -v ~/muse_data:/app/prisma/db \
            -e DATABASE_URL="file:/app/prisma/db/prod.db" \
            muse-app

          # Setup Caddy for automatic HTTPS (if not already running)
          if ! docker ps --format '{{.Names}}' | grep -q '^caddy$'; then
            mkdir -p ~/caddy_data ~/caddy_config
            docker run -d \
              --name caddy \
              --restart always \
              --network muse-net \
              -p 80:80 \
              -p 443:443 \
              -v ~/caddy_data:/data \
              -v ~/caddy_config:/config \
              caddy:2-alpine caddy reverse-proxy --from x402muse.com --to muse-app:3000
          else
            # Caddy already running, just make sure it can reach the new container
            docker network connect muse-net caddy 2>/dev/null || true
          fi
