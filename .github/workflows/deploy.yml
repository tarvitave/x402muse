name: Deploy to Droplet

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Check for Known Vulnerabilities (npm audit)
      run: |
        echo "=== Dependency Vulnerability Scan ==="
        # Run npm audit, capture output. Only fail on critical/high.
        AUDIT_OUTPUT=$(npm audit --json 2>/dev/null || true)

        CRITICAL=$(echo "$AUDIT_OUTPUT" | jq '.metadata.vulnerabilities.critical // 0')
        HIGH=$(echo "$AUDIT_OUTPUT" | jq '.metadata.vulnerabilities.high // 0')
        MODERATE=$(echo "$AUDIT_OUTPUT" | jq '.metadata.vulnerabilities.moderate // 0')

        echo "Critical: $CRITICAL"
        echo "High: $HIGH"
        echo "Moderate: $MODERATE"

        if [ "$CRITICAL" -gt 0 ]; then
          echo ""
          echo "::error::Found $CRITICAL critical vulnerability(ies) in dependencies. Blocking deployment."
          npm audit --audit-level=critical 2>/dev/null || true
          exit 1
        fi

        if [ "$HIGH" -gt 0 ]; then
          echo ""
          echo "::warning::Found $HIGH high severity vulnerability(ies) in dependencies."
          npm audit --audit-level=high 2>/dev/null || true
        fi

        echo "No critical dependency vulnerabilities. Proceeding."

    - name: Run Security Linting (Semgrep)
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/javascript
          p/typescript
          p/nodejs
          p/owasp-top-ten
      env:
        SEMGREP_RULES: p/javascript p/typescript p/nodejs p/owasp-top-ten
      continue-on-error: true

  deploy:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout the code in the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Copy files to the Droplet (bypasses git clone auth issues on the server)
    - name: Copy to Droplet
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DO_HOST }}
        username: root
        key: ${{ secrets.DO_SSH_KEY }}
        source: "."
        target: "~/x402muse"
        rm: true # Cleans the target directory before copy to remove stale files

    # 3. Build and Run on the Droplet
    - name: Build and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DO_HOST }}
        username: root
        key: ${{ secrets.DO_SSH_KEY }}
        timeout: 30m
        command_timeout: 30m
        script: |
          # 1. Setup Swap to prevent OOM kills during build (if not exists)
          if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
              echo "Created 2GB swap file"
          fi

          cd ~/x402muse

          # 2. Build Docker Image (with progress plain to see logs)
          docker build --progress=plain --no-cache \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            -t muse-app .

          # Cleanup Old App Container
          docker stop muse-app || true
          docker rm muse-app || true

          # Create persistent data directory on host (uid 1001 = nextjs user in container)
          mkdir -p ~/muse_data
          chown 1001:1001 ~/muse_data

          # Create Docker network for Caddy <-> App communication
          docker network create muse-net 2>/dev/null || true

          # Run App Container (only exposed to Docker network, not host)
          docker run -d \
            --name muse-app \
            --restart always \
            --network muse-net \
            -v ~/muse_data:/app/prisma/db \
            -e DATABASE_URL="file:/app/prisma/db/prod.db" \
            -e ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            -e TREASURY_WALLET_ADDRESS="${{ secrets.TREASURY_WALLET_ADDRESS }}" \
            -e SOLANA_RPC_URL="${{ secrets.SOLANA_RPC_URL }}" \
            -e RIJKS_API_KEY="${{ secrets.RIJKS_API_KEY }}" \
            -e TREASURY_PRIVATE_KEY="${{ secrets.TREASURY_PRIVATE_KEY }}" \
            -e WEEKLY_PAYOUT_SOL="${{ secrets.WEEKLY_PAYOUT_SOL }}" \
            -e CRON_SECRET="${{ secrets.CRON_SECRET }}" \
            -e STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            -e MOONPAY_SECRET_KEY="${{ secrets.MOONPAY_SECRET_KEY }}" \
            -e ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            -e SMTP_HOST="${{ secrets.SMTP_HOST }}" \
            -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
            -e SMTP_USER="${{ secrets.SMTP_USER }}" \
            -e SMTP_PASS="${{ secrets.SMTP_PASS }}" \
            -e SES_CONFIGURATION_SET="${{ secrets.SES_CONFIGURATION_SET }}" \
            muse-app

          # Setup Caddy for automatic HTTPS (if not already running)
          if ! docker ps --format '{{.Names}}' | grep -q '^caddy$'; then
            mkdir -p ~/caddy_data ~/caddy_config
            docker run -d \
              --name caddy \
              --restart always \
              --network muse-net \
              -p 80:80 \
              -p 443:443 \
              -v ~/caddy_data:/data \
              -v ~/caddy_config:/config \
              caddy:2-alpine caddy reverse-proxy --from x402muse.com --to muse-app:3000
          else
            # Caddy already running, just make sure it can reach the new container
            docker network connect muse-net caddy 2>/dev/null || true
          fi
